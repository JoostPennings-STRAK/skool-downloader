name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-deploy:
    name: Build image + deploy to MX
    runs-on: [self-hosted, linux, amd64]
    steps:
      - name: Checkout
        run: |
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@git.strak.jp/${{ github.repository }}.git" .
          git checkout "${{ github.sha }}"

      # The runner shares the host Docker daemon with the deploy step, so the
      # image stays local — no registry push (the Playwright base is too large
      # for the ingress) and no registry storage on the Pi.
      - name: Build image
        run: docker build --provenance=false -t git.strak.jp/homelab/skool-downloader:latest .

      - name: Deploy
        run: |
          cd /opt/stacks/skool-downloader
          docker compose up -d --force-recreate --remove-orphans

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' skool-downloader 2>/dev/null || echo missing)
            [ "$STATUS" = "healthy" ] && echo "✓ Healthy" && exit 0
            echo "Waiting... ($STATUS)"
            sleep 5
          done
          echo "✗ Timeout" && docker logs skool-downloader --tail=30 && exit 1
