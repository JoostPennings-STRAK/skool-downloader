name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build image (amd64)
    runs-on: [self-hosted, linux, amd64]
    steps:
      - name: Checkout
        run: |
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@git.strak.jp/${{ github.repository }}.git" .
          git checkout "${{ github.sha }}"

      - name: Docker login
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login git.strak.jp \
            -u AdminJoost --password-stdin

      - name: Build and push
        run: |
          IMAGE=git.strak.jp/homelab/skool-downloader
          docker build -t "$IMAGE:latest" .
          docker push "$IMAGE:latest"

  deploy:
    name: Deploy op MX
    needs: build
    runs-on: [self-hosted, linux, amd64]
    steps:
      - name: Docker login
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login git.strak.jp \
            -u AdminJoost --password-stdin

      - name: Deploy
        run: |
          cd /opt/stacks/skool-downloader
          docker compose pull
          docker compose up -d --force-recreate --remove-orphans

      - name: Health check
        run: |
          for i in $(seq 1 24); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' skool-downloader 2>/dev/null || echo missing)
            [ "$STATUS" = "healthy" ] && echo "✓ Healthy" && exit 0
            echo "Wachten... ($STATUS)"
            sleep 5
          done
          echo "✗ Timeout" && docker logs skool-downloader --tail=30 && exit 1
